name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repo, so give its token read-only access.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cheapest checks first, so simple mistakes fail fast.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e -w apps/api
      - run: npm run build
